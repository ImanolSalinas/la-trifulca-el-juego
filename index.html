<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <title>La Trifulca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <div id="app">
      <div id="stage">

        <button type="button" id="talk">Hablar</button>
      </div>
    </div>
